name: Build MiVI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Capacitor and Android plugins
        run: |
          pnpm add @capacitor/core@8 @capacitor/android@8 @capacitor/filesystem@8 @capacitor/share@8 @capgo/capacitor-file-sharer@8
          pnpm add -D @capacitor/cli@8

      - name: Build MiVI web app
        run: pnpm exec vite build --base=./ --target=chrome70

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ariizup.mivi",
            "appName": "MiVI",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Generate Android project
        run: node ./node_modules/@capacitor/cli/bin/capacitor add android

      - name: Copy web app into Android project
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace --info
      - name: Upload MiVI APK
        uses: actions/upload-artifact@v4
        with:
          name: MiVI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
